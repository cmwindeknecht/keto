[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = False

# Ignore missing stubs for specific libraries without type stubs
[mypy-pydantic_settings]
ignore_missing_imports = True

[mypy-pytest]
ignore_missing_imports = True

[mypy-elasticsearch]
ignore_missing_imports = True

[mypy-redis]
ignore_missing_imports = True

[mypy-redis.*]
ignore_missing_imports = True

[mypy-httpx]
ignore_missing_imports = True

[mypy-aiokafka]
ignore_missing_imports = True

[mypy-uvicorn]
ignore_missing_imports = True

[mypy-alembic]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-alembic.versions.*]
ignore_errors = True
