sonar.projectKey=keto-backend
sonar.projectName=Keto Backend - FastAPI
sonar.projectVersion=1.0.0
sonar.sources=backend-fastapi/app
sonar.tests=backend-fastapi/tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Coverage
sonar.python.coverage.reportPaths=backend-fastapi/coverage.xml
sonar.coverage.exclusions=**/__pycache__/**,**/tests/**,**/.venv/**

# Exclusions
sonar.exclusions=**/__pycache__/**,**/tests/**,**/migrations/**,**/.venv/**

# Code Smells
sonar.python.pylint.reportPath=backend-fastapi/pylint-report.txt

# Issue severity levels
sonar.issue.ignore.multicriteria=python.S3776
sonar.issue.ignore.multicriteria.python.S3776.ruleKey=python:S3776
sonar.issue.ignore.multicriteria.python.S3776.resourceKey=**/*.py
