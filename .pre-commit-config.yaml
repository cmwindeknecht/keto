repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        files: \.(yaml|yml)$
      - id: check-added-large-files
        args: ['--maxkb=1000']

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3.12
        args: ['--line-length=150']

  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=150']

  - repo: https://github.com/PyCQA/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: ['--max-line-length=150', '--ignore=E203,W503,E501']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        additional_dependencies: ['sqlalchemy', 'pydantic', 'fastapi']
        args: ['--python-version=3.12', '--check-untyped-defs']
        files: backend-fastapi

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        additional_dependencies: ['pbr']
        args: ['-c', 'backend-fastapi/.bandit', '-ll']
        files: backend-fastapi

  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: bash -c 'cd backend-fastapi && python -m pytest tests/ -q'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
