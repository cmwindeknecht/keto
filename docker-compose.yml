version: '3.8'

services:
  # Database
  postgres:
    image: postgres:16-alpine
    container_name: keto-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: keto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ketodb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - keto

  # Cache
  redis:
    image: redis:7-alpine
    container_name: keto-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - keto

  # Message Queue - Zookeeper (required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: keto-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    networks:
      - keto

  # Message Queue - Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: keto-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - keto

  # Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: keto-elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - keto

  # Stream Processing
  flink-jobmanager:
    image: flink:1.18-scala_2.12
    container_name: keto-flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    volumes:
      - flink_data:/opt/flink/data
    networks:
      - keto

  flink-taskmanager:
    image: flink:1.18-scala_2.12
    container_name: keto-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
    networks:
      - keto

  # FastAPI Backend
  backend-fastapi:
    build:
      context: .
      dockerfile: docker/backend-fastapi.Dockerfile
    container_name: keto-backend-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.local
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-keto}
      - REDIS_URL=redis://redis:6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - USDA_API_KEY=${USDA_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend-fastapi:/app
    networks:
      - keto
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Go API Gateway
  backend-go:
    build:
      context: .
      dockerfile: docker/backend-go.Dockerfile
    container_name: keto-backend-go
    ports:
      - "8080:8080"
    environment:
      - FASTAPI_URL=http://backend-fastapi:8000
      - REDIS_URL=redis:6379
      - PORT=8080
    depends_on:
      - backend-fastapi
      - redis
    volumes:
      - ./backend-go:/app
    networks:
      - keto

  # React Frontend
  frontend-react:
    build:
      context: .
      dockerfile: docker/frontend-react.Dockerfile
    container_name: keto-frontend-react
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend-go
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    networks:
      - keto
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  elasticsearch_data:
  flink_data:

networks:
  keto:
    driver: bridge
